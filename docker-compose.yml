version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: vigilance-redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  vigilance-core:
    build:
      context: .
      dockerfile: docker/Dockerfile.x86_gpu
    container_name: vigilance-core
    command: python3 demo_stage3_pipeline.py
    volumes:
      - .:/app
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  alert-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.x86_gpu
    container_name: vigilance-alert-worker
    command: python3 offline_cache.py
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      - redis
    restart: always

  c2-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.x86_gpu
    container_name: vigilance-c2-backend
    command: uvicorn c2_backend:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./data:/app/data
    depends_on:
      - redis
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/telemetry"]
      interval: 10s
      timeout: 5s
      retries: 3

  c2-frontend:
    image: nginx:alpine
    container_name: vigilance-c2-frontend
    ports:
      - "80:80"
    volumes:
      - ./c2_frontend:/usr_share_nginx_html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/incidents:/app/data/incidents:ro
    depends_on:
      - c2-backend
    restart: always
